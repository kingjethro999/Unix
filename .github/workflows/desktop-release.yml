name: Publish desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: --win
          - name: macOS
            runner: macos-latest
            target: --mac
          - name: Linux
            runner: ubuntu-latest
            target: --linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install vlt
        run: npm install --global vlt@1.0.10
      - name: Install dependencies
        run: vlt install
      - name: Build desktop package
        env:
          UNIX_DESKTOP_URL: ${{ vars.UNIX_DESKTOP_URL }}
        run: node scripts/build-desktop.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: unix-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --title "Unix $TAG"
          while IFS= read -r -d '' asset; do
            for attempt in 1 2 3 4 5; do
              gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber && break
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          done < <(find release -maxdepth 1 -type f -print0 | sort -z)
