services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unix}
      POSTGRES_USER: ${POSTGRES_USER:-unix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unix_local_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - unix_postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-unix} -d ${POSTGRES_DB:-unix}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  unix_postgres_data:
